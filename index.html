<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>MindFlow - 本地化视觉思维导图</title>

    <link rel="manifest" href="manifest.json">
    <link rel="stylesheet" href="css/style.css">

    <script type="module" src="js/app.js"></script>

    <script src="js/lib/d3.v7.min.js"></script>
    <script src="js/lib/localforage.min.js"></script>
    <script src="js/lib/marked.min.js"></script>
    <script src="js/lib/purify.min.js"></script>
</head>
<body>

<input type="file" id="importInput" style="display: none;" accept=".json,.mindflow">

<div class="app-container">
    <div class="sidebar closed" id="sidebar">
        <div class="sidebar-header">
            <div class="brand">MindFlow</div>
            <div class="project-control">
                <label for="projSelect"></label><select id="projSelect" class="project-select">
                <option value="" disabled selected>正在加载...</option>
            </select>
                <div class="search-box">
                    <span class="search-icon">🔍</span>
                    <label>
                        <input type="text" class="search-input" placeholder="搜索资源..." oninput="app.ui.filterResources(this.value)">
                    </label>
                    <select class="sort-select" onchange="app.ui.setSortMode(this.value)" title="排序方式">
                        <option value="created">创建时间</option>
                        <option value="updated">更新时间</option>
                        <option value="name">名称</option>
                        <option value="type">类型</option>
                    </select>
                </div>
                <div class="btn-group-mini">
                    <button class="btn-icon" title="导出到本地磁盘" onclick="app.storage.triggerSaveDisk()">💾</button>
                    <button class="btn-icon" title="从磁盘打开项目" onclick="app.storage.triggerOpenDisk()">📂</button>
                    <button class="btn-icon" title="复制当前项目" onclick="app.ui.duplicateCurrentProject()">📋</button>
                    <button class="btn-icon danger" title="删除当前项目" onclick="app.ui.confirmDeleteProject()">🗑️</button>
                </div>
            </div>
        </div>

        <div class="sidebar-content">
            <div id="tagFilterArea" class="tag-filter-area"></div>
            <div id="resList" class="res-list tree-view">
                <div class="empty-tip">暂无资源</div>
            </div>
        </div>

        <div class="sidebar-footer" id="sidebarFooter">
            <button class="btn-secondary" style="flex:1;" onclick="app.ui.handleCreateFolder()" title="新建文件夹">📁</button>
            <button class="btn-primary" style="flex:3;" onclick="app.ui.openResModal()">+ 添加资源</button>
            <button class="btn-secondary" style="flex:1;" onclick="app.ui.toggleBatchMode()" title="批量管理">☑️</button>
        </div>
        <div class="batch-bar" id="batchBar" style="display:none;">
            <span id="batchCount">已选 0 项</span>
            <select id="batchFolderSelect" class="batch-folder-select"><option value="">移到...</option></select>
            <button class="btn-secondary batch-action-btn" onclick="app.ui.batchMoveToFolder()">📂 移动</button>
            <button class="btn-danger batch-action-btn" onclick="app.ui.batchDelete()">🗑️ 删除</button>
            <button class="btn-secondary batch-action-btn" onclick="app.ui.toggleBatchMode()">取消</button>
        </div>
    </div>

    <div class="main-area">
        <div class="toolbar">
            <div class="toolbar-left">
                <button class="tool-btn" onclick="app.ui.toggleSidebar()" title="菜单">☰</button>
                <button class="tool-btn primary" onclick="app.graph.addRootNode()" title="添加根节点"><span>+ 根节点</span></button>
            </div>
            <div class="toolbar-center">
                <input type="text" id="projTitleInput" class="project-title-input" placeholder="未命名项目" onchange="app.data.renameProject(this.value)" title="点击重命名项目">
            </div>
            <div class="toolbar-right">
                <button class="tool-btn" onclick="app.graph.resetCamera()" title="视图归位 (双击画布)">🔎</button>
                <div class="export-dropdown">
                    <button class="tool-btn" onclick="app.ui.toggleExportMenu()" title="导出">📤 <span class="dropdown-arrow">▾</span></button>
                    <div class="export-menu" id="exportMenu">
                        <button onclick="app.ui.exportImage(); app.ui.closeExportMenu()">📷 导出 PNG</button>
                        <button onclick="app.graph.exportSVG(); app.ui.closeExportMenu()">📐 导出 SVG</button>
                    </div>
                </div>
                <button class="tool-btn" id="btnToggleMinimap" onclick="app.ui.toggleMinimap()" title="小地图">🗺️</button>
                <button class="tool-btn" onclick="app.ui.toggleTheme()" title="切换主题">🌗</button>
                <button class="tool-btn" onclick="app.ui.toggleNodeSearch()" title="搜索节点">🔍</button>
                <button class="tool-btn" onclick="document.getElementById('shortcutsModal').style.display='flex'" title="快捷键">⌨️</button>
            </div>
            <div class="node-search-bar" id="nodeSearchBar" style="display:none;">
                <input type="text" id="nodeSearchInput" class="node-search-input" placeholder="搜索节点..." oninput="app.ui.searchNodes(this.value)">
                <span id="nodeSearchCount" class="node-search-count"></span>
                <button class="node-search-btn" onclick="app.ui.nodeSearchPrev()" title="上一个">▲</button>
                <button class="node-search-btn" onclick="app.ui.nodeSearchNext()" title="下一个">▼</button>
                <button class="node-search-btn" onclick="app.ui.toggleNodeSearch()" title="关闭">✕</button>
            </div>
        </div>

        <div id="saveStatus" class="status-text">就绪</div>

        <div class="canvas-wrapper" id="canvasWrapper">
            <canvas id="mainCanvas"></canvas>
        </div>
    </div>
</div>

<div id="nodeBubble" class="node-bubble-container" style="display: none;">
    <button class="bubble-btn action-edit" onclick="app.ui.onBubbleEdit()" title="编辑节点">
        <span style="font-size: 16px;">✏️</span>
    </button>
    <!-- [New] 飞线按钮 -->
    <button class="bubble-btn action-link" onclick="app.ui.onBubbleLink()" title="创建连线">
        <span style="font-size: 16px;">🪡</span>
    </button>
    <button class="bubble-btn action-delete" onclick="app.ui.onBubbleDelete()" title="删除节点">
        <span style="font-size: 16px;">🗑️</span>
    </button>
</div>

<!-- [新增] 通用单行输入弹窗 -->
<div class="modal-overlay" id="inputModal" style="display: none;">
    <div class="modal-box" style="width: 360px;">
        <h3 id="inputModalTitle">输入</h3>
        <div class="form-group" style="margin-top: 20px;">
            <label for="inputModalValue"></label><input type="text" id="inputModalValue" class="form-input" placeholder="" autocomplete="off">
        </div>
        <div class="modal-actions">
            <button class="btn-secondary" id="inputModalCancel">取消</button>
            <button class="btn-primary" id="inputModalConfirm">确定</button>
        </div>
    </div>
</div>

<!-- [修改] 现代化资源添加/编辑弹窗 -->
<div class="modal-overlay" id="resModal" style="display: none;">
    <div class="modern-modal">
        <div class="panel-header">
            <h3 id="resModalTitle">✨ 添加资源</h3>
            <button class="close-btn" onclick="app.ui.closeModal('resModal')">×</button>
        </div>

        <div class="panel-body">
            <div class="form-group">
                <label class="panel-label">资源类型</label>
                <div class="select-wrapper">
                    <select id="resType" class="form-input panel-select" onchange="app.ui.toggleResInput()">
                        <option value="image">🖼️ 图片 (Image)</option>
                        <option value="md">📝 文档 (Markdown)</option>
                        <option value="code">💻 代码段 (Code)</option>
                        <option value="color">🎨 色卡 (Palette)</option>
                        <option value="audio">🎤 音频 (Audio)</option>
                        <option value="link">🔗 链接 (Link)</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <div class="form-group">
                <label class="panel-label">存储位置</label>
                <div class="select-wrapper">
                    <select id="resParentId" class="form-input panel-select">
                        <option value="">(根目录)</option>
                    </select>
                    <span class="select-arrow">▼</span>
                </div>
            </div>

            <div class="form-group">
                <label class="panel-label">资源名称</label>
                <input type="text" id="resName" class="form-input panel-input" placeholder="给它起个名字...">
            </div>

            <div class="form-group">
                <label class="panel-label">标签 <small style="text-transform:none;font-weight:normal;letter-spacing:0;">(用逗号分隔)</small></label>
                <input type="text" id="resTags" class="form-input panel-input" placeholder="创意, 参考, 重要...">
            </div>

            <!-- 动态内容区域 -->
            <div class="form-group dynamic-input" id="groupFile">
                <label class="panel-label" id="fileLabel">选择文件</label>
                <input type="file" id="resFile" class="form-input panel-input" style="padding: 8px;">
            </div>

            <div class="form-group dynamic-input" id="groupText" style="display: none;">
                <label class="panel-label" id="textLabel">内容</label>
                <input type="text" id="resTextInput" class="form-input panel-input" style="display:none;" placeholder="输入链接地址...">
                <textarea id="resTextArea" class="form-input panel-input" rows="8" style="font-family: monospace; line-height: 1.5;" placeholder="# Markdown Title..."></textarea>
            </div>

            <div class="form-group dynamic-input" id="groupColor" style="display: none;">
                <label class="panel-label">选择颜色</label>
                <div style="display:flex; align-items:center; gap:12px; background: var(--bg-app); padding: 8px; border-radius: 8px; border: 1px solid var(--border-color);">
                    <input type="color" id="resColorInput" style="width:40px; height:40px; border:none; padding:0; cursor: pointer; border-radius: 4px;">
                    <span id="resColorValue" style="font-family:monospace; font-weight:bold; font-size: 16px;">#000000</span>
                </div>
            </div>
        </div>

        <div class="panel-footer">
            <button class="btn-secondary" onclick="app.ui.closeModal('resModal')">取消</button>
            <button class="btn-primary" onclick="app.ui.handleSaveResourceClick()">保存资源</button>
        </div>
    </div>
</div>

<div class="node-menu modern-panel" id="nodeMenu" style="display: none;">
    <div class="panel-header">
        <h3>编辑节点</h3>
        <button class="close-btn" onclick="document.getElementById('nodeMenu').style.display='none'">×</button>
    </div>

    <div class="panel-body">
        <div class="form-group">
            <label class="panel-label">名称</label>
            <label for="nodeLabel"></label><input type="text" id="nodeLabel" class="form-input panel-input" placeholder="节点标题...">
        </div>

        <div class="form-group">
            <label class="panel-label">关联资源</label>
            <div class="select-wrapper">
                <label for="nodeResSelect"></label><select id="nodeResSelect" class="form-input panel-select"></select>
                <span class="select-arrow">▼</span>
            </div>
        </div>

        <div class="form-group form-row">
            <label class="panel-label">颜色</label>
            <div style="display:flex;gap:8px;align-items:center;">
                <input type="color" id="nodeColor" style="width:36px;height:30px;border:1px solid var(--border-color);border-radius:6px;padding:2px;cursor:pointer;background:none;">
                <button type="button" id="nodeColorReset" class="btn-sm" title="重置为默认颜色">重置</button>
            </div>
        </div>

        <div class="form-group form-row">
            <label class="panel-label">质感</label>
            <div class="texture-options" style="display:flex;gap:6px;flex:1;">
                <button type="button" class="texture-btn" data-texture="glass">玻璃</button>
                <button type="button" class="texture-btn" data-texture="acrylic">亚克力</button>
                <button type="button" class="texture-btn" data-texture="metallic">金属</button>
            </div>
        </div>

        <div class="form-group form-row">
            <label class="panel-label">布局</label>
            <div class="layout-options" style="display:flex;gap:6px;flex:1;">
                <button type="button" class="layout-btn" data-layout="icon">图标</button>
                <button type="button" class="layout-btn" data-layout="card">卡片</button>
            </div>
        </div>

        <div class="form-group form-row" id="shapeRatioRow">
            <label class="panel-label" id="shapeRatioLabel">形状</label>
            <div id="shapeOptions" class="shape-options" style="display:flex;gap:6px;flex:1;">
                <button type="button" class="shape-btn" data-shape="circle" title="圆形">●</button>
                <button type="button" class="shape-btn" data-shape="rounded-rect" title="圆角方形">▢</button>
            </div>
            <div id="ratioOptions" class="ratio-options" style="display:none;gap:6px;flex:1;">
                <button type="button" class="ratio-btn" data-ratio="1:1">1:1</button>
                <button type="button" class="ratio-btn" data-ratio="3:4">3:4</button>
                <button type="button" class="ratio-btn" data-ratio="4:3">4:3</button>
                <button type="button" class="ratio-btn" data-ratio="16:9">16:9</button>
            </div>
        </div>

        <div class="form-group form-row">
            <label class="panel-label">边框</label>
            <div class="select-wrapper" style="flex:1;">
                <select id="nodeBorderStyle" class="form-input panel-select" style="font-size:12px;">
                    <option value="solid">实线</option>
                    <option value="glow">发光</option>
                    <option value="double">双线</option>
                    <option value="gradient">渐变</option>
                </select>
                <span class="select-arrow">▼</span>
            </div>
        </div>

        <div class="form-group">
            <label class="panel-label">备注</label>
            <textarea id="nodeNote" class="form-input panel-input" rows="2" placeholder="备注..."></textarea>
        </div>
    </div>

    <div class="panel-footer">
        <button class="btn-primary full-width" onclick="app.ui.handleSaveNodeEdit()">保存</button>
    </div>
</div>

<div id="toastContainer" class="toast-container"></div>

<!-- [P1-3] Inline edit input for node labels -->
<input type="text" id="inlineEditInput" class="inline-edit-input" style="display:none;">

<!-- [P2-3] Keyboard shortcuts help modal -->
<div class="modal-overlay" id="shortcutsModal" style="display:none;">
    <div class="modern-modal" style="max-width:480px;">
        <div class="panel-header">
            <h3>⌨️ 快捷键</h3>
            <button class="close-btn" onclick="app.ui.closeModal('shortcutsModal')">×</button>
        </div>
        <div class="panel-body" style="max-height:60vh;overflow-y:auto;">
            <table class="shortcuts-table">
                <tr><td><kbd>Ctrl</kbd>+<kbd>Z</kbd></td><td>撤销</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>Y</kbd></td><td>重做</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>N</kbd></td><td>新建根节点</td></tr>
                <tr><td><kbd>Tab</kbd></td><td>为选中节点添加子节点</td></tr>
                <tr><td><kbd>F2</kbd></td><td>编辑节点标签</td></tr>
                <tr><td><kbd>Delete</kbd></td><td>删除选中节点/连线</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>C</kbd></td><td>复制节点</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>V</kbd></td><td>粘贴节点</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>D</kbd></td><td>复制选中节点</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>S</kbd></td><td>保存</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>E</kbd></td><td>导出图片</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>F</kbd></td><td>搜索资源</td></tr>
                <tr><td><kbd>Ctrl</kbd>+<kbd>G</kbd></td><td>搜索节点 (下一个)</td></tr>
                <tr><td><kbd>Alt</kbd>+<kbd>L</kbd></td><td>切换飞线显示</td></tr>
                <tr><td><kbd>Shift</kbd>+拖拽</td><td>平移画布</td></tr>
                <tr><td><kbd>?</kbd></td><td>显示此帮助</td></tr>
            </table>
        </div>
    </div>
</div>

<!-- [Feature 3] Full-screen resource viewer modal -->
<div class="modal-overlay" id="viewerModal" style="display:none;">
    <div class="viewer-modal">
        <div class="panel-header">
            <h3 id="viewerTitle">📄 资源查看</h3>
            <button class="close-btn" onclick="app.ui.closeModal('viewerModal')">×</button>
        </div>
        <div id="viewerContent" class="viewer-content"></div>
    </div>
</div>

<script>
    if (window.innerWidth < 768) document.getElementById('sidebar').classList.add('closed');
    else document.getElementById('sidebar').classList.remove('closed');

    if(localStorage.getItem('theme') === 'dark') {
        document.body.setAttribute('data-theme', 'dark');
    }

    if ('serviceWorker' in navigator) {
        window.addEventListener('load', () => {
            let refreshing = false;
            navigator.serviceWorker.addEventListener('controllerchange', () => {
                if (refreshing) return;
                refreshing = true;
                window.location.reload();
            });
            navigator.serviceWorker.register('sw.js')
                .then(registration => { console.log('SW Registered:', registration.scope); })
                .catch(err => { console.log('SW Registration Failed:', err); });
        });
    }
</script>
</body>
</html>
